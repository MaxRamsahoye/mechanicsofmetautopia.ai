    // the site's favicon in the theme chosen there (or the system's)
    try {
      var sys = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';

    } catch (e) {}
  </script>
  <style>
    /* the article's PDF, the whole window, under the site's favicon and title;

    html, body {
      height: 100%;
      margin: 0;
      background: #525659;
    }

    .pdf {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;

    /* where a browser cannot show a PDF in a page: a link to it */

      justify-content: center;
      height: 100%;
      margin: 0;
      font: 16px/1.5 'Inter', system-ui, sans-serif;
